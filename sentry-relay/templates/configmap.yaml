apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentry-relay.fullname" . }}
  labels:
    {{- include "sentry-relay.labels" . | nindent 4 }}
data:
  config.yml: |
    relay:
      mode: {{ .Values.relay.mode }}
      upstream: {{ .Values.relay.upstream | quote }}
      host: {{ .Values.relay.host | quote }}
      port: {{ .Values.relay.port }}
      {{- if .Values.relay.tls }}
      tls:
        {{- toYaml .Values.relay.tls | nindent 8 }}
      {{- end }}
    logging:
      level: {{ .Values.relay.logging.level }}
      {{- if .Values.relay.logging.format }}
      format: {{ .Values.relay.logging.format }}
      {{- end }}
    {{- if .Values.relay.processing.enabled }}
    processing:
      enabled: true
      {{- if .Values.relay.processing.kafka }}
      kafka_config:
        {{- toYaml .Values.relay.processing.kafka | nindent 8 }}
      {{- end }}
      {{- if .Values.relay.processing.redis }}
      redis: {{ .Values.relay.processing.redis | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.relay.outcomes }}
    outcomes:
      {{- toYaml .Values.relay.outcomes | nindent 6 }}
    {{- end }}
    {{- if .Values.extraConfig }}
    {{- toYaml .Values.extraConfig | nindent 4 }}
    {{- end }}
